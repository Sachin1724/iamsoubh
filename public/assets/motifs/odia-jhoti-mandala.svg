<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- Odia Manabasa Jhoti / Chita Sacred Lotus Mandala -->
  <defs>
    <filter id="jhoti-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g stroke="#FFFDF7" stroke-linecap="round" stroke-linejoin="round" filter="url(#jhoti-glow)">
    
    <!-- Outer Sacred Circle with Rice Grain Dots -->
    <circle cx="250" cy="250" r="235" stroke-width="2" stroke-dasharray="1 8" />
    <circle cx="250" cy="250" r="222" stroke-width="2.5" />
    <circle cx="250" cy="250" r="212" stroke-width="1.5" stroke-dasharray="4 6" />

    <!-- 16 Outer Curling Tendrils / Creepers (Chita Lata) -->
    <g stroke-width="2" fill="none">
      <!-- 0 deg -->
      <path d="M 250,28 C 240,10 215,15 220,38 C 224,52 245,50 250,65 C 255,50 276,52 280,38 C 285,15 260,10 250,28 Z" fill="#FFFDF7" fill-opacity="0.15" />
      <!-- 90 deg -->
      <path d="M 472,250 C 490,240 485,215 462,220 C 448,224 450,245 435,250 C 450,255 448,276 462,280 C 485,285 490,260 472,250 Z" fill="#FFFDF7" fill-opacity="0.15" />
      <!-- 180 deg -->
      <path d="M 250,472 C 240,490 215,485 220,462 C 224,448 245,450 250,435 C 255,450 276,448 280,462 C 285,485 260,490 250,472 Z" fill="#FFFDF7" fill-opacity="0.15" />
      <!-- 270 deg -->
      <path d="M 28,250 C 10,240 15,215 38,220 C 52,224 50,245 65,250 C 50,255 52,276 38,280 C 15,285 10,260 28,250 Z" fill="#FFFDF7" fill-opacity="0.15" />

      <!-- Diagonals: 45, 135, 225, 315 -->
      <g transform="rotate(45 250 250)">
        <path d="M 250,28 C 240,10 215,15 220,38 C 224,52 245,50 250,65 C 255,50 276,52 280,38 C 285,15 260,10 250,28 Z" fill="#FFFDF7" fill-opacity="0.15" />
        <path d="M 472,250 C 490,240 485,215 462,220 C 448,224 450,245 435,250 C 450,255 448,276 462,280 C 485,285 490,260 472,250 Z" fill="#FFFDF7" fill-opacity="0.15" />
        <path d="M 250,472 C 240,490 215,485 220,462 C 224,448 245,450 250,435 C 255,450 276,448 280,462 C 285,485 260,490 250,472 Z" fill="#FFFDF7" fill-opacity="0.15" />
        <path d="M 28,250 C 10,240 15,215 38,220 C 52,224 50,245 65,250 C 50,255 52,276 38,280 C 15,285 10,260 28,250 Z" fill="#FFFDF7" fill-opacity="0.15" />
      </g>
    </g>

    <!-- Ring of 16 Scalloped Lotus Petals -->
    <circle cx="250" cy="250" r="175" stroke-width="2" />
    <g stroke-width="2" fill="#FFFDF7" fill-opacity="0.08">
      <path d="M 250,75 C 265,115 285,140 250,175 C 215,140 235,115 250,75 Z"/>
      <path d="M 250,425 C 265,385 285,360 250,325 C 215,360 235,385 250,425 Z"/>
      <path d="M 75,250 C 115,265 140,285 175,250 C 140,215 115,235 75,250 Z"/>
      <path d="M 425,250 C 385,265 360,285 325,250 C 360,215 385,235 425,250 Z"/>

      <g transform="rotate(45 250 250)">
        <path d="M 250,75 C 265,115 285,140 250,175 C 215,140 235,115 250,75 Z"/>
        <path d="M 250,425 C 265,385 285,360 250,325 C 215,360 235,385 250,425 Z"/>
        <path d="M 75,250 C 115,265 140,285 175,250 C 140,215 115,235 75,250 Z"/>
        <path d="M 425,250 C 385,265 360,285 325,250 C 360,215 385,235 425,250 Z"/>
      </g>
    </g>

    <!-- Middle Ring with Rice Grain Garland (Dhana Khesa) -->
    <circle cx="250" cy="250" r="125" stroke-width="2" />
    <circle cx="250" cy="250" r="115" stroke-width="1.5" stroke-dasharray="3 5" />

    <!-- Inner 8-Petal Sacred Blooming Lotus (Ashta-Dala Padma) -->
    <g stroke-width="2.5" fill="#FFFDF7" fill-opacity="0.18">
      <path d="M 250,135 C 262,165 272,185 250,210 C 228,185 238,165 250,135 Z"/>
      <path d="M 250,365 C 262,335 272,315 250,290 C 228,315 238,335 250,365 Z"/>
      <path d="M 135,250 C 165,262 185,272 210,250 C 185,228 165,238 135,250 Z"/>
      <path d="M 365,250 C 335,262 315,272 290,250 C 315,228 335,238 365,250 Z"/>

      <g transform="rotate(45 250 250)">
        <path d="M 250,135 C 262,165 272,185 250,210 C 228,185 238,165 250,135 Z"/>
        <path d="M 250,365 C 262,335 272,315 250,290 C 228,315 238,335 250,365 Z"/>
        <path d="M 135,250 C 165,262 185,272 210,250 C 185,228 165,238 135,250 Z"/>
        <path d="M 365,250 C 335,262 315,272 290,250 C 315,228 335,238 365,250 Z"/>
      </g>
    </g>

    <!-- Center Seed Pod (Karnika) with Sacred Lakshmi Paduka (Maa Lakshmi's Feet) -->
    <circle cx="250" cy="250" r="38" stroke-width="2" fill="#FFFDF7" fill-opacity="0.2" />
    <circle cx="250" cy="250" r="32" stroke-width="1.5" stroke-dasharray="2 4" />

    <!-- Left Foot -->
    <g fill="#FFFDF7" stroke="none">
      <!-- Heel & Sole -->
      <ellipse cx="242" cy="254" rx="5" ry="9" transform="rotate(-5 242 254)" />
      <!-- 5 Toes -->
      <circle cx="237" cy="242" r="1.8"/>
      <circle cx="240" cy="240" r="2"/>
      <circle cx="243" cy="240" r="2"/>
      <circle cx="246" cy="241" r="1.8"/>
      <circle cx="249" cy="243" r="1.6"/>
    </g>

    <!-- Right Foot -->
    <g fill="#FFFDF7" stroke="none">
      <!-- Heel & Sole -->
      <ellipse cx="258" cy="254" rx="5" ry="9" transform="rotate(5 258 254)" />
      <!-- 5 Toes -->
      <circle cx="251" cy="243" r="1.6"/>
      <circle cx="254" cy="241" r="1.8"/>
      <circle cx="257" cy="240" r="2"/>
      <circle cx="260" cy="240" r="2"/>
      <circle cx="263" cy="242" r="1.8"/>
    </g>

    <!-- Decorative Central Bindu Dots -->
    <circle cx="250" cy="232" r="2" fill="#FFFDF7" stroke="none" />
    <circle cx="250" cy="268" r="2" fill="#FFFDF7" stroke="none" />
  </g>
</svg>
