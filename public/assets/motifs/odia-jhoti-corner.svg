<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Odia Jhoti Corner Floral Creeper (Chita Lata & Padma) -->
  <g stroke="#FFFDF7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Corner Root Spiral -->
    <path d="M 12,12 C 30,12 55,20 68,45 C 78,65 72,92 52,105 C 36,115 15,108 10,88 C 6,70 20,52 38,48 C 52,45 68,55 72,70" stroke-width="2.5"/>
    <circle cx="72" cy="70" r="3" fill="#FFFDF7"/>

    <!-- Main Arching Tendril radiating along Top -->
    <path d="M 68,45 C 95,25 145,20 185,32 C 210,40 225,58 215,80 C 205,100 180,95 178,78 C 176,62 192,50 208,55" stroke-width="2"/>
    <circle cx="208" cy="55" r="2.5" fill="#FFFDF7"/>

    <!-- Main Arching Tendril radiating along Left -->
    <path d="M 45,68 C 25,95 20,145 32,185 C 40,210 58,225 80,215 C 100,205 95,180 78,178 C 62,176 50,192 55,208" stroke-width="2"/>
    <circle cx="55" cy="208" r="2.5" fill="#FFFDF7"/>

    <!-- Blooming Jhoti Lotus Bud in the Center Angle -->
    <g transform="translate(100, 100) rotate(45)" fill="#FFFDF7" fill-opacity="0.2" stroke-width="2">
      <!-- Central Petal -->
      <path d="M 0,0 C -12,-25 -8,-50 0,-70 C 8,-50 12,-25 0,0 Z" />
      <!-- Left Petal -->
      <path d="M 0,0 C -25,-15 -45,-30 -42,-55 C -30,-48 -15,-30 0,0 Z" />
      <!-- Right Petal -->
      <path d="M 0,0 C 25,-15 45,-30 42,-55 C 30,-48 15,-30 0,0 Z" />
      <!-- Rice Grain Pods -->
      <circle cx="0" cy="-25" r="2.5" fill="#FFFDF7"/>
      <circle cx="0" cy="-45" r="2.5" fill="#FFFDF7"/>
    </g>

    <!-- Radiating Rice Grains (Dhana Khesa) along top branch -->
    <g fill="#FFFDF7" stroke="none">
      <ellipse cx="110" cy="22" rx="4" ry="2" transform="rotate(-15 110 22)"/>
      <ellipse cx="135" cy="22" rx="4" ry="2" transform="rotate(-5 135 22)"/>
      <ellipse cx="160" cy="25" rx="4" ry="2" transform="rotate(10 160 25)"/>
      
      <!-- along left branch -->
      <ellipse cx="22" cy="110" rx="2" ry="4" transform="rotate(15 22 110)"/>
      <ellipse cx="22" cy="135" rx="2" ry="4" transform="rotate(5 22 135)"/>
      <ellipse cx="25" cy="160" rx="2" ry="4" transform="rotate(-10 25 160)"/>

      <!-- Sacred footsteps near corner -->
      <ellipse cx="38" cy="22" rx="3" ry="5" transform="rotate(20 38 22)"/>
      <ellipse cx="22" cy="38" rx="5" ry="3" transform="rotate(20 22 38)"/>
    </g>

    <!-- Outer border arc with delicate dots -->
    <path d="M 230,10 A 220 220 0 0 1 10,230" stroke-width="1.5" stroke-dasharray="3 6"/>
  </g>
</svg>
