<svg xmlns="http://www.w3.org/2000/svg" width="32" height="80" viewBox="0 0 32 80">
  <defs>
    <!-- Seamless Sambalpuri Bandha/Ikat Vertical Tile -->
  </defs>

  <!-- Deep Sambalpuri Dark Ground -->
  <rect width="32" height="80" fill="#140E0E"/>

  <!-- Outer Selvage Line (outer border edge) -->
  <line x1="1" y1="0" x2="1" y2="80" stroke="#E0A526" stroke-width="1.5"/>
  <line x1="3" y1="0" x2="3" y2="80" stroke="#8A1717" stroke-width="1"/>

  <!-- Inner Edge Rule -->
  <line x1="30.5" y1="0" x2="30.5" y2="80" stroke="#E0A526" stroke-width="1.5"/>

  <!-- Sambalpuri Kumbha (Temple Spire Triangles pointing inward from outer edge) -->
  <g fill="#E0A526">
    <polygon points="3,6 10,10 3,14"/>
    <polygon points="3,26 10,30 3,34"/>
    <polygon points="3,46 10,50 3,54"/>
    <polygon points="3,66 10,70 3,74"/>
  </g>

  <!-- Ikat Bandha Motif 1: Sacred Diamond Lozenge with stepped tie-dye edges (Center at y=20) -->
  <g>
    <!-- Terracotta Red Outer Diamond -->
    <polygon points="19,10 26,20 19,30 12,20" fill="#C8221A"/>
    <!-- Gold Middle Stepped Bandha Layer -->
    <polygon points="19,13 23.5,20 19,27 14.5,20" fill="#E0A526"/>
    <!-- Ivory / Rice White Core -->
    <polygon points="19,16 21.5,20 19,24 16.5,20" fill="#FFFDF7"/>
    <!-- Stepped Ikat "feathering" notches -->
    <rect x="25.5" y="19" width="1.5" height="2" fill="#E0A526"/>
    <rect x="11" y="19" width="1.5" height="2" fill="#E0A526"/>
    <rect x="18" y="8.5" width="2" height="1.5" fill="#E0A526"/>
    <rect x="18" y="30" width="2" height="1.5" fill="#E0A526"/>
  </g>

  <!-- Divider Ikat Dots between lozenges (at y=40) -->
  <g fill="#E0A526">
    <circle cx="19" cy="40" r="2.5"/>
    <circle cx="19" cy="35" r="1.2" fill="#FFFDF7"/>
    <circle cx="19" cy="45" r="1.2" fill="#FFFDF7"/>
    <circle cx="14" cy="40" r="1.2" fill="#C8221A"/>
    <circle cx="24" cy="40" r="1.2" fill="#C8221A"/>
  </g>

  <!-- Ikat Bandha Motif 2: Conch/Floral Diamond (Center at y=60) -->
  <g>
    <!-- Crimson Outer Diamond -->
    <polygon points="19,50 26,60 19,70 12,60" fill="#8A1717"/>
    <!-- Gold Inner Diamond -->
    <polygon points="19,53 23.5,60 19,67 14.5,60" fill="#E0A526"/>
    <!-- Ivory Core -->
    <polygon points="19,56 21.5,60 19,64 16.5,60" fill="#FFFDF7"/>
    <!-- Stepped Ikat "feathering" notches -->
    <rect x="25.5" y="59" width="1.5" height="2" fill="#E0A526"/>
    <rect x="11" y="59" width="1.5" height="2" fill="#E0A526"/>
    <rect x="18" y="48.5" width="2" height="1.5" fill="#E0A526"/>
    <rect x="18" y="70" width="2" height="1.5" fill="#E0A526"/>
  </g>

  <!-- Divider Ikat Dots at y=80 (wraps seamlessly to y=0) -->
  <g fill="#E0A526">
    <circle cx="19" cy="0" r="2.5"/>
    <circle cx="19" cy="5" r="1.2" fill="#FFFDF7"/>
    <circle cx="19" cy="75" r="1.2" fill="#FFFDF7"/>
  </g>
</svg>
